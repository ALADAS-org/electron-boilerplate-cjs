<!DOCTYPE html>
<html>
  <head>
    <!-- <meta charset="UTF-8"/> -->
	<title>QRcode Editor </title>
	
	<!-- ----------------- Third party libraries ----------------- -->
	<script type="text/javascript" src="lib/jquery-3.6.3.min.js"></script>		
    <link rel="stylesheet" type="text/css" href="css/iziToast.css">
    <script type="text/javascript" src="lib/iziToast.min.js"></script>
	<script type="text/javascript" src="lib/qrcode-decoder.min.js"></script>
	<!-- ----------------- Third party libraries -->	
	
	<!-- ----------------- Renderer prerequisite modules ----------------- -->
	<script type="text/javascript" src="src/utils/log/konsola.js"></script>		
	<script type="text/javascript" src="src/utils/html/html_utils.js"></script>
	<script type="text/javascript" src="src/view/viewlet_loader.js"></script>
	<script type="text/javascript" src="src/view/dialog_utils.js"></script>
	
	<script type="text/javascript" src="src/const_events.js"></script>
	<script type="text/javascript" src="src/model/const_model_keys.js"></script>		
	<script type="text/javascript" src="src/view/const_view.js"></script>
    <script type="text/javascript" src="src/view/actions/abstract_action.js"></script>
    <script type="text/javascript" src="src/view/actions/null_action.js"></script>
    <script type="text/javascript" src="src/view/action_registry.js"></script>	
	<script type="text/javascript" src="src/view/renderer_gui.js"></script>
	<!-- ----------------- Renderer prerequisite modules -->	
	
	<link rel="stylesheet" type="text/css" href="css/custom_menu.css">
	<link rel="stylesheet" type="text/css" href="css/style.css">
  </head>
  
  <body>  
  	<!-- 'ElectronMain.This.includeActions()' includes all 'actions' in src/view/actions -->
	<span id="actions-include-slot" hidden>
	</span>
	
	<!-- =================== Horizontal Hierachic Menubar ===================== -->
	<span id="menubar" viewlet-html="src/view/viewlets/menubar/menubar.html"></span>
	<script type="text/javascript" src="src/view/viewlets/menubar/menubar.js"></script>
	<!-- =================== Horizontal Hierachic ToolBar -->	
	
	<!-- ========================== Main ToolBar ============================= -->
	<span id="main_toolbar" viewlet-html="src/view/viewlets/main_toolbar/main_toolbar.html"></span>	
	<script type="text/javascript" src="src/view/viewlets/main_toolbar/main_toolbar.js"></script>
	<!-- =========================== Main ToolBar -->
	
	<!-- ============================= Body ================================ -->
	<span id="body" viewlet-html="src/view/viewlets/body/body.html"></span>
	<script type="text/javascript" src="src/view/viewlets/body/body.js"></script>
	<!-- =========================== Body -->
	
	<!-- ======================= Command Palette =========================== -->
	<span id="command_palette_container" 
	      viewlet-html="src/view/viewlets/command_palette/command_palette.html"
		  target-slot="command_palette_slot"></span>	
	<script type="text/javascript" src="src/view/viewlets/command_palette/command_palette.js"></script>
	<link rel="stylesheet" type="text/css" href="src/view/viewlets/command_palette/command_palette.css">
	<!-- ======================= Command Palette -->
	
	<!-- includes all html <div> entities with 'viewlet-html' attribute -->
	<script>ViewletLoader.This.includeViewlets();</script>

    <script>ActionRegistry.This.setEventHandlers();</script>	
  </body>
</html>
